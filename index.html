<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaxia de Amor - Flores Amarillas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="./assets/flores_data.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #550a00 0%, #200000 55%, #050002 100%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            touch-action: none;
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;

        }

        #hint {
            position: absolute;
            bottom: 24px;
            width: 100%;
            text-align: center;
            color: rgba(255, 230, 200, 0.65);
            font-size: 14px;
            letter-spacing: 1.5px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 2s ease-in;
            text-shadow: 0 0 10px rgba(255, 120, 0, 0.5);
        }

        /* PANTALLA DE CARGA / INTRO */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #320202 0%, #0c0102 70%, #000000 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.2s ease-in-out, transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 20px;
            text-align: center;
        }

        #loader-screen.dismiss {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .loader-ring {
            width: 75px;
            height: 75px;
            border: 3px solid rgba(255, 150, 0, 0.15);
            border-top: 3px solid #ffbb00;
            border-radius: 50%;
            animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin-bottom: 28px;
            box-shadow: 0 0 25px rgba(255, 187, 0, 0.4);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loader-text {
            color: #ffe6bb;
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 400;
            animation: pulse 2s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(255, 170, 0, 0.6);
            max-width: 90%;
            line-height: 1.4;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(0.98);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #start-btn {
            background: linear-gradient(135deg, #ff5500 0%, #e63900 50%, #b82600 100%);
            color: #ffffff;
            border: none;
            padding: 16px 42px;
            font-size: 17px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            opacity: 0;
            margin-top: 25px;
        }

        #start-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 35px rgba(255, 69, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        #start-btn:active {
            transform: scale(0.97);
        }

        /* BOTÓN DE LA CARTA */
        #letter-icon {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            background: linear-gradient(135deg, #ff5500 0%, #e63900 100%);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.45);
            transition: all 0.3s ease;
            color: white;
            font-size: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #letter-icon:hover {
            transform: scale(1.12) rotate(-8deg);
            box-shadow: 0 12px 25px rgba(255, 69, 0, 0.6);
        }

        /* MODAL DE CARTA / DEDICATORIA */
        #message-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        #message-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: radial-gradient(circle at top right, #380505 0%, #170202 60%, #0c0001 100%);
            border: 1px solid rgba(255, 110, 0, 0.4);
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 120, 0, 0.4) transparent;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 69, 0, 0.25);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 120, 0, 0.35);
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 150, 0, 0.6);
        }

        /* ENVOLTORIO Y FOTO ENMARCADA */
        .modal-photo-wrapper {
            position: relative;
            display: inline-block;
            margin: 4px auto 20px auto;
            border-radius: 20px;
            padding: 4px;
            background: linear-gradient(135deg, rgba(255, 187, 0, 0.8) 0%, rgba(255, 85, 0, 0.4) 50%, rgba(255, 215, 0, 0.8) 100%);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 120, 0, 0.35);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .modal-photo-wrapper:hover {
            transform: scale(1.03) rotate(-0.5deg);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 35px rgba(255, 140, 0, 0.5);
        }

        .modal-photo {
            display: block;
            width: 100%;
            max-width: 220px;
            max-height: 240px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #message-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            color: #ffbb33;
            font-size: 38px;
            margin: 0 0 16px 0;
            font-family: 'Dancing Script', cursive;
            text-shadow: 0 2px 10px rgba(255, 150, 0, 0.4);
        }

        .modal-body {
            color: #f3f3f3;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 28px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .close-modal {
            background: transparent;
            border: 2px solid #ff5500;
            color: #ff8833;
            padding: 12px 34px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: #ff5500;
            color: white;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.5);
        }

        /* BOTÓN DE MÚSICA */
        #music-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 50;
            background: linear-gradient(180deg, #ff66aa 0%, #e60067 100%);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 0, 103, 0.4);
            transition: all 0.3s ease;
            color: white;
            font-size: 22px;
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        #music-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 12px 25px rgba(230, 0, 103, 0.6);
        }

        #music-btn.playing {
            animation: pulse-music 1.8s infinite;
        }

        @keyframes pulse-music {
            0% {
                box-shadow: 0 0 0 0 rgba(230, 0, 103, 0.6);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(230, 0, 103, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(230, 0, 103, 0);
            }
        }

        /* ==========================================
           RESPONSIVE DESIGN (TABLETS & CELULARES)
           ========================================== */
        @media (max-width: 768px) {
            #hint {
                bottom: 88px;
                font-size: 12.5px;
                padding: 0 65px;
            }

            .modal-content {
                padding: 28px 20px;
                max-width: 92vw;
            }

            .modal-title {
                font-size: 32px;
                margin-bottom: 12px;
            }

            .modal-photo {
                max-width: 180px;
                max-height: 200px;
            }

            .modal-body {
                font-size: 15px;
                line-height: 1.6;
                margin-bottom: 22px;
            }

            .close-modal {
                padding: 10px 28px;
                font-size: 14px;
            }

            #music-btn,
            #letter-icon {
                width: 48px;
                height: 48px;
                font-size: 19px;
                bottom: 20px;
            }

            #music-btn {
                left: 20px;
            }

            #letter-icon {
                right: 20px;
            }
        }

        @media (max-width: 400px) {
            #loader-text {
                font-size: 18px;
            }

            #start-btn {
                padding: 13px 30px;
                font-size: 15px;
            }

            .modal-content {
                padding: 22px 15px;
            }

            .modal-title {
                font-size: 28px;
            }

            .modal-photo {
                max-width: 150px;
                max-height: 165px;
            }

            .modal-body {
                font-size: 14px;
            }

            #hint {
                bottom: 82px;
                font-size: 11px;
                padding: 0 50px;
            }
        }

        /* Orientación horizontal en celulares */
        @media (max-height: 550px) {
            .modal-content {
                max-height: 92vh;
                padding: 16px 20px;
            }

            .modal-photo-wrapper {
                margin-bottom: 8px;
            }

            .modal-photo {
                max-width: 110px;
                max-height: 115px;
            }

            .modal-title {
                font-size: 26px;
                margin-bottom: 6px;
            }

            .modal-body {
                font-size: 13px;
                margin-bottom: 12px;
                line-height: 1.4;
            }

            #hint {
                display: none;
            }
        }
    </style>

</head>

<body>

    <!-- PANTALLA DE ENTRADA -->
    <div id="loader-screen">
        <div class="loader-ring" id="loader-ring"></div>
        <p id="loader-text">Preparando el universo...</p>
        <button id="start-btn">Descubrir Galaxia ✨</button>
    </div>

    <!-- BOTÓN DE CARTA FLOTANTE -->
    <div id="letter-icon" title="Abrir dedicatoria">
        <i class="fas fa-envelope-open-text"></i>
    </div>

    <!-- MODAL DE DEDICATORIA -->
    <div id="message-modal">
        <div class="modal-content">
            <h2 class="modal-title">Rossy...</h2>

            <!-- FOTO ROMÁNTICA ENMARCADA -->
            <div class="modal-photo-wrapper">
                <img src="./assets/rossy.jpg" alt="rossy" class="modal-photo" loading="eager">
            </div>

            <p class="modal-body">
                Eres la coincidencia más hermosa que me pudo pasar.<br><br>
                Así como estas flores y estrellas iluminan la inmensidad,<br>
                tu sonrisa ilumina cada uno de mis días.<br><br>
                ¡Feliz Día de las Flores Amarillas!<br>
                <strong>Te quiero.</strong>
            </p>
            <button class="close-modal" id="close-modal-btn">Cerrar</button>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE DE MÚSICA -->
    <div id="music-btn" title="Activar / Silenciar Música">
        <i id="music-icon" class="fas fa-volume-mute"></i>
    </div>

    <!-- CANVAS THREE.JS -->
    <div id="canvas-container"></div>
    <div id="hint">✨ Desliza para explorar la galaxia en 3D ✨</div>

    <script>
        // --- CONFIGURACIÓN DE ASSETS (Local con Fallback Remoto) ---
        const audioSrc = './assets/musica.mp3';
        const remoteAudioSrc = 'https://bcodestorague.anteroteobaldob.workers.dev/share/anteroteobaldob_gmail_com/AUDIO/Flores%20amarillas.mp3';

        const flowerImages = [
            './assets/ramo_tulipanes.png',
            './assets/ramo_flores.png',
            './assets/ramo_girasol.png'
        ];
        const remoteFlowerImages = [
            'https://bcodestorague.anteroteobaldob.workers.dev/share/anteroteobaldob_gmail_com/BC_Detalles_Pro/Detalles%20v2/Dia%20De%20Las%20Flores%20Amarillas/images/ramo%20tulipanes.png',
            'https://bcodestorague.anteroteobaldob.workers.dev/share/anteroteobaldob_gmail_com/BC_Detalles_Pro/Detalles%20v2/Dia%20De%20Las%20Flores%20Amarillas/images/ramo%20de%20flores.png',
            'https://bcodestorague.anteroteobaldob.workers.dev/share/anteroteobaldob_gmail_com/BC_Detalles_Pro/Detalles%20v2/Dia%20De%20Las%20Flores%20Amarillas/images/ramo%20girasol1.png'
        ];

        // --- SISTEMA DE AUDIO ---
        let audio = new Audio();
        audio.src = audioSrc;
        audio.loop = true;
        audio.volume = 0.75;
        audio.preload = 'auto';

        // Fallback a URL remota si el archivo local falla
        audio.addEventListener('error', () => {
            if (audio.src !== remoteAudioSrc) {
                console.warn("Fallo audio local, usando remoto...");
                audio.src = remoteAudioSrc;
                audio.load();
            }
        });

        let musicPlaying = false;
        const musicBtn = document.getElementById('music-btn');
        const musicIcon = document.getElementById('music-icon');

        function playMusic() {
            audio.play().then(() => {
                musicPlaying = true;
                musicIcon.className = 'fas fa-heart';
                musicBtn.classList.add('playing');
            }).catch(e => {
                console.log("Autoplay bloqueado por el navegador:", e);
            });
        }

        function toggleMusic() {
            if (!musicPlaying) {
                playMusic();
            } else {
                audio.muted = !audio.muted;
                if (audio.muted) {
                    musicIcon.className = 'fas fa-volume-mute';
                    musicBtn.classList.remove('playing');
                } else {
                    musicIcon.className = 'fas fa-heart';
                    musicBtn.classList.add('playing');
                }
            }
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        // --- PANTALLA DE CARGA / BOTÓN INICIAR ---
        const loaderScreen = document.getElementById('loader-screen');
        const loaderRing = document.getElementById('loader-ring');
        const loaderText = document.getElementById('loader-text');
        const startBtn = document.getElementById('start-btn');
        const hint = document.getElementById('hint');

        setTimeout(() => {
            loaderRing.style.display = 'none';
            loaderText.innerHTML = '🌻 Feliz Día de las Flores Amarillas, Rossy 🌻';
            startBtn.style.display = 'inline-block';
            setTimeout(() => {
                startBtn.style.opacity = '1';
            }, 50);
        }, 1800);

        startBtn.addEventListener('click', () => {
            loaderScreen.classList.add('dismiss');
            playMusic();
            setTimeout(() => {
                hint.style.opacity = '1';
            }, 1200);
        });

        // --- CARTA / MODAL ---
        const letterIcon = document.getElementById('letter-icon');
        const messageModal = document.getElementById('message-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        letterIcon.addEventListener('click', () => {
            messageModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            messageModal.classList.remove('active');
        });

        messageModal.addEventListener('click', (e) => {
            if (e.target === messageModal) {
                messageModal.classList.remove('active');
            }
        });

        // ==========================================
        // --- MOTOR THREE.JS Y ESCENA 3D ---
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 0.75) {
                // Celular en modo vertical: alejamos la cámara para encuadre perfecto
                camera.position.set(0, 5, 58);
                if (window.controls) {
                    controls.minDistance = 22;
                    controls.maxDistance = 95;
                }
            } else if (aspect < 1.1) {
                // Tablets o pantallas casi cuadradas
                camera.position.set(0, 5, 50);
                if (window.controls) {
                    controls.minDistance = 18;
                    controls.maxDistance = 90;
                }
            } else {
                // Desktop y laptops
                camera.position.set(0, 5, 45);
                if (window.controls) {
                    controls.minDistance = 15;
                    controls.maxDistance = 85;
                }
            }
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.3;
        controls.enablePan = false;
        controls.minDistance = 15;
        controls.maxDistance = 85;

        // --- PLANETA CENTRAL CON ANILLOS (TIPO SATURNO CÓSMICO) ---
        const planetGroup = new THREE.Group();
        scene.add(planetGroup);

        const sphereGeo = new THREE.SphereGeometry(5, 64, 64);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        planetGroup.add(sphere);

        // Anillo interior (Naranja brillante)
        const ringGeo = new THREE.RingGeometry(6.5, 9, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xff4500,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2 - 0.2;
        planetGroup.add(ring);

        // Anillo exterior (Dorado ámbar suave)
        const ringGeo2 = new THREE.RingGeometry(9.5, 10.2, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.55
        });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2 - 0.2;
        planetGroup.add(ring2);

        // --- PALABRAS Y DEDICATORIAS FLOTANTES EN 3D ---
        const palabras = [
            "❤️ Mi amor", "✨ Mi sol", "🌌 Mi universo", "🔥 Pasión",
            "🥰 Dulzura", "🪐 Mi destino", "🌟 Brillas", "💕 Ternura",
            "😍 Mi cielo", "💖 Felicidad", "💫 Esperanza", "👑 Reina",
            "🍒 Contigo", "🌹 Mi flor", "🦋 Libertad", "🧸 Mi calma",
            "🌠 Sueños", "🔒 Eternidad", "🧩 Mi razón", "🎉 Mi fiesta"
        ];

        function crearTextoSprite(texto) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            context.font = "bold 38px 'Outfit', Arial, sans-serif";
            context.textAlign = "center";
            context.textBaseline = "middle";

            context.shadowColor = "rgba(255, 100, 0, 1)";
            context.shadowBlur = 18;
            context.fillStyle = "#ffffff";

            context.fillText(texto, canvas.width / 2, canvas.height / 2);

            const textura = new THREE.CanvasTexture(canvas);
            textura.needsUpdate = true;

            const material = new THREE.SpriteMaterial({
                map: textura,
                transparent: true,
                alphaTest: 0.05,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(16, 4, 1);
            return sprite;
        }

        const particulasTextos = new THREE.Group();
        scene.add(particulasTextos);

        const cantidadTextos = 140;
        for (let i = 0; i < cantidadTextos; i++) {
            const palabraRandom = palabras[Math.floor(Math.random() * palabras.length)];
            const sprite = crearTextoSprite(palabraRandom);

            const radio = 16 + Math.random() * 22;
            const angulo = Math.random() * Math.PI * 2;
            const altura = (Math.random() - 0.5) * 50;

            sprite.position.x = radio * Math.cos(angulo);
            sprite.position.y = altura;
            sprite.position.z = radio * Math.sin(angulo);

            const escalaRandom = 0.55 + Math.random() * 0.65;
            sprite.scale.multiplyScalar(escalaRandom);

            particulasTextos.add(sprite);
        }

        // --- FLORES Y GIRASOLES AMARILLOS FLOTANTES ---
        const particulasFlores = new THREE.Group();
        scene.add(particulasFlores);

        const textureLoader = new THREE.TextureLoader();

        // Carga inmediata en Base64 (100% compatible con doble clic directo file:// y offline)
        // con respaldo a imágenes optimizadas y remotas si fuera necesario
        const flowerSources = (window.FLOWER_DATA && window.FLOWER_DATA.length === 3)
            ? window.FLOWER_DATA
            : [
                './assets/tulipanes_opt.png',
                './assets/flores_opt.png',
                './assets/girasol_opt.png'
            ];

        flowerSources.forEach((src, idx) => {
            textureLoader.load(
                src,
                (texture) => {
                    crearInstanciasFlor(texture);
                },
                undefined,
                (err) => {
                    console.warn("Fallo carga de flor " + idx + ", intentando fallback...", err);
                    const fallbackSrc = remoteFlowerImages[idx] || ('./assets/' + ['ramo_tulipanes.png', 'ramo_flores.png', 'ramo_girasol.png'][idx]);
                    textureLoader.load(fallbackSrc, (texture) => {
                        crearInstanciasFlor(texture);
                    });
                }
            );
        });

        function crearInstanciasFlor(texture) {
            texture.generateMipmaps = true;
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                alphaTest: 0.15,
                depthWrite: false
            });

            // 20 ejemplares de cada ramo orbitando la galaxia
            for (let i = 0; i < 20; i++) {
                const flor = new THREE.Sprite(material);

                const radio = 22 + Math.random() * 32;
                const angulo = Math.random() * Math.PI * 2;
                const altura = (Math.random() - 0.5) * 44;

                flor.position.x = radio * Math.cos(angulo);
                flor.position.y = altura;
                flor.position.z = radio * Math.sin(angulo);

                const escalaRandom = 5.5 + Math.random() * 5.5;
                flor.scale.set(escalaRandom, escalaRandom, 1);

                particulasFlores.add(flor);
            }
        }

        // --- CAMPO ESTELAR (1000 ESTRELLAS) ---
        const estrellasGeo = new THREE.BufferGeometry();
        const cantidadEstrellas = 1000;
        const posicionesEstrellas = new Float32Array(cantidadEstrellas * 3);

        for (let i = 0; i < cantidadEstrellas * 3; i++) {
            posicionesEstrellas[i] = (Math.random() - 0.5) * 220;
        }

        estrellasGeo.setAttribute('position', new THREE.BufferAttribute(posicionesEstrellas, 3));
        const estrellasMat = new THREE.PointsMaterial({
            color: 0xffddaa,
            size: 0.35,
            transparent: true,
            opacity: 0.85
        });
        const estrellas = new THREE.Points(estrellasGeo, estrellasMat);
        scene.add(estrellas);

        // --- RESPONSIVE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            updateCameraPosition();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- BUCLE DE ANIMACIÓN ---
        function animar() {
            requestAnimationFrame(animar);

            controls.update();

            const tiempo = Date.now() * 0.001;

            // Ondulación sutil del planeta
            planetGroup.position.y = Math.sin(tiempo * 2) * 0.5;

            // Palabras flotando rítmicamente
            particulasTextos.position.y = Math.sin(tiempo) * 0.5;

            // Ramos de flores flotando y rotando lentamente
            particulasFlores.position.y = Math.cos(tiempo * 0.8) * 0.8;
            particulasFlores.rotation.y = tiempo * 0.05;

            // Giro lento del fondo de estrellas
            estrellas.rotation.y += 0.0004;

            renderer.render(scene, camera);
        }

        animar();
    </script>
</body>

</html>
